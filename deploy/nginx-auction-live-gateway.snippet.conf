# Upstream for Phase 2B Redis read gateway (localhost only).
upstream auction_live_gateway {
    server 127.0.0.1:8090;
    keepalive 64;
}

# Named fallback → existing Odoo upstream (defined elsewhere as "odoo").
# Include this snippet INSIDE the HTTPS server {} block, BEFORE "location /".
#
# ROLLBACK: comment out the three location blocks below and reload nginx.
# Traffic returns to Browser → Odoo with no application code change.

# ── Live Board poll ──────────────────────────────────────────────────────────
location ~ "^/([^/]+)/([^/]+)/auction/live-board/data$" {
    proxy_pass         http://auction_live_gateway;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_connect_timeout 100ms;
    proxy_read_timeout    200ms;
    proxy_send_timeout    200ms;
    proxy_intercept_errors on;
    error_page 404 502 503 504 = @odoo_poll_fallback;
}

# ── Projector poll (POST JSON-RPC) ───────────────────────────────────────────
location ~ "^/([^/]+)/auction/projector/([^/]+)/data$" {
    proxy_pass         http://auction_live_gateway;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_connect_timeout 100ms;
    proxy_read_timeout    200ms;
    proxy_send_timeout    200ms;
    proxy_intercept_errors on;
    error_page 404 502 503 504 = @odoo_poll_fallback;
}

# ── Bid Summary poll ─────────────────────────────────────────────────────────
location ~ "^/([^/]+)/([^/]+)/auction/show/team/balance/json$" {
    proxy_pass         http://auction_live_gateway;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_connect_timeout 100ms;
    proxy_read_timeout    200ms;
    proxy_send_timeout    200ms;
    proxy_intercept_errors on;
    error_page 404 502 503 504 = @odoo_poll_fallback;
}

location @odoo_poll_fallback {
    proxy_pass              http://odoo;
    proxy_http_version      1.1;
    proxy_set_header        Connection "";
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_buffer_size       128k;
    proxy_buffers           8 256k;
    proxy_busy_buffers_size 256k;
}
